openapi: 3.0.3
info:
  title: PAD2 Lazuardy API
  version: 1.0.0
  description: |
    Dokumentasi API untuk backend Laravel PAD2 Lazuardy.

    Semua endpoint menggunakan format response standar:

    - Success:
      {
        "status": "success",
        "message": "string",
        "data": object|null
      }

    - Error:
      {
        "status": "error",
        "message": "string",
        "error": object|string
      }
servers:
  - url: https://api.example.com

tags:
  - name: Auth
    description: Auth & account flows (Sanctum)
  - name: Social Auth
    description: Social authentication (mobile)
  - name: Dashboard
    description: Student and tutor dashboards
  - name: Schedule
    description: Student/tutor schedules
  - name: Review
    description: Student reviews
  - name: Tutor
    description: Tutor discovery and public profile

paths:
  /login:
    post:
      tags: [Auth]
      summary: Login
      description: Login menggunakan email dan password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseData'
              examples:
                success:
                  value:
                    status: success
                    message: Login berhasil
                    data:
                      token: 13|5kbhGYFDyl6uYaVSkWoZcUz88L0GrgeqYMwrPZd60b6e9bad
                      user:
                        id: 9
                        name: John Doe
                        email: student@example.com
                        email_verified_at: '2026-04-17T11:46:51.000000Z'
                        role: student
                        telephone_number: '0812345678910'
                        telephone_verified_at: null
                        profile_photo_path: null
                        date_of_birth: '2005-01-15T00:00:00.000000Z'
                        gender: male
                        religion: islam
                        home_address:
                          street: Jl. Airlangga No. 10
                          regency: Surabaya
                          district: Gubeng
                          province: Jawa Timur
                          subdistrict: Airlangga
                        google_id: null
                        facebook_id: null
                        latitude: '-7.26998030'
                        longitude: '112.75208830'
                        created_at: '2026-04-17T11:46:51.000000Z'
                        updated_at: '2026-04-17T11:46:51.000000Z'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  value:
                    status: error
                    message: Invalid credentials
                    error: Invalid credentials
        '422':
          $ref: '#/components/responses/ValidationError'

  /register:
    post:
      tags: [Auth]
      summary: Register (send OTP)
      description: Mengirim OTP ke email untuk memulai flow registrasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSendOtpRequest'
      responses:
        '201':
          description: OTP terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterSendOtpResponseData'
              examples:
                success:
                  value:
                    status: success
                    message: OTP berhasil terkirim ke email
                    data:
                      otp: '9817'
        '422':
          $ref: '#/components/responses/ValidationError'

  /register/verify:
    patch:
      tags: [Auth]
      summary: Verify register OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVerifyOtpRequest'
      responses:
        '200':
          description: OTP valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterVerifyOtpResponseData'
              examples:
                ok:
                  value:
                    status: success
                    message: OTP is valid.
                    data:
                      identifier: student@example.com
        '400':
          description: OTP tidak valid / kadaluarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /register/resend-otp:
    patch:
      tags: [Auth]
      summary: Resend register OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterResendOtpRequest'
      responses:
        '200':
          description: OTP dikirim ulang
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterResendOtpResponseData'
        '422':
          $ref: '#/components/responses/ValidationError'

  /register/student:
    patch:
      tags: [Auth]
      summary: Complete student registration
      description: Lengkapi profil student setelah OTP diverifikasi.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '201':
          description: Registrasi student berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterCompleteResponseData'
              examples:
                success:
                  value:
                    status: success
                    message: Registrasi akun berhasil
                    data:
                      token: 12|NwNJ0RnGEx2pAyDXFcjTUOJknrZq5ZPnqf8p4vkZd889724f
        '422':
          $ref: '#/components/responses/ValidationError'

  /register/tutor:
    patch:
      tags: [Auth]
      summary: Complete tutor registration
      description: Lengkapi profil tutor setelah OTP diverifikasi.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterTutorRequest'
      responses:
        '201':
          description: Registrasi tutor berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterCompleteResponseData'
              examples:
                success:
                  value:
                    status: success
                    message: Registrasi akun berhasil
                    data:
                      token: 14|IR0U6BF6M8q9GFxdF8PHhyfKntJUJlp8OV9Km5JP5e9e728f
        '422':
          $ref: '#/components/responses/ValidationError'

  /forgot-password:
    post:
      tags: [Auth]
      summary: Forgot password (send OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: OTP reset password terkirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForgotPasswordResponseData'
              examples:
                success:
                  value:
                    status: success
                    message: OTP untuk reset password telah dikirim ke email Anda.
                    data:
                      otp: '3226'
                      temp_token: vx2BO0dZ7NDTtHQ
        '422':
          $ref: '#/components/responses/ValidationError'

  /forgot-password/verify:
    patch:
      tags: [Auth]
      summary: Verify forgot-password OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordVerifyRequest'
      responses:
        '200':
          description: OTP valid, dapat melanjutkan reset password
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForgotPasswordVerifyResponseData'
              examples:
                success:
                  value:
                    status: success
                    message: OTP is valid.
                    data:
                      token: eSUueSszVyeCI8C
        '400':
          description: OTP tidak valid / kadaluarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reset-password:
    patch:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                ok:
                  value:
                    status: success
                    message: Password berhasil direset.
                    data: []
        '422':
          $ref: '#/components/responses/ValidationError'

  /logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                ok:
                  value:
                    status: success
                    message: Logout berhasil
                    data: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me:
    get:
      tags: [Auth]
      summary: Get current user (role-based)
      description: |
        Response `data` bergantung pada role:

        - role=student -> `data.student` terisi
        - role=tutor -> `data.tutor` terisi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil user saat ini
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MeProfile'
              examples:
                student:
                  value:
                    status: success
                    message: Berhasil mengambil profil
                    data:
                      id: 9
                      name: John Doe
                      email: student@example.com
                      role: student
                      telephone_number: '0812345678910'
                      profile_photo_path: null
                      gender: male
                      date_of_birth: '2005-01-15'
                      religion: islam
                      address:
                        street: Jl. Airlangga No. 10
                        city: Surabaya
                        province: Jawa Timur
                        district: Gubeng
                        subdistrict: Airlangga
                        latitude: '-7.26998030'
                        longitude: '112.75208830'
                      student:
                        class_name: Kelas 1
                        parent:
                          name: null
                          telephone_number: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    patch:
      tags: [Auth]
      summary: Update current user (partial)
      description: Partial update. Kirim hanya field yang ingin diubah.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MeProfile'
              examples:
                ok:
                  value:
                    status: success
                    message: Berhasil memperbarui profil
                    data:
                      id: 9
                      name: Student Updated
                      email: student@example.com
                      role: student
                      telephone_number: '0812345678910'
                      profile_photo_path: uploads/dummy.jpg
                      gender: male
                      date_of_birth: '2005-01-15'
                      religion: islam
                      address:
                        street: Jl. Airlangga No. 10
                        city: Surabaya
                        province: Jawa Timur
                        district: Gubeng
                        subdistrict: Airlangga
                        latitude: '-7.26998030'
                        longitude: '112.75208830'
                      student:
                        class_name: Kelas 1
                        parent:
                          name: null
                          telephone_number: null
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/{provider}/mobile:
    post:
      tags: [Social Auth]
      summary: Social auth mobile
      description: |
        - Jika user sudah ada -> login dan mengembalikan `token`.
        - Jika user belum ada -> memulai register flow dan mengembalikan `temp_token`.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
          example: google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialAuthMobileRequest'
      responses:
        '200':
          description: Berhasil (login atau register flow)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/SocialAuthLoginData'
                          - $ref: '#/components/schemas/SocialAuthRegisterData'
        '422':
          $ref: '#/components/responses/ValidationError'

  /dashboard/student:
    get:
      tags: [Dashboard]
      summary: Student dashboard
      description: |
        Dashboard student berbasis session (jatah belajar), bukan study packages.
        `upcoming_schedules` = jadwal minggu ini & minggu depan.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard student
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentDashboardData'
              examples:
                success:
                  value:
                    status: success
                    message: Dashboard student berhasil dimuat.
                    data:
                      profile:
                        id: 9
                        name: John Doe
                        email: student@example.com
                        role: student
                      session:
                        remaining_sessions: 7
                        used_sessions: 8
                        total_sessions: 15
                      upcoming_schedules:
                        - id: 10
                          subject:
                            id: 2
                            name: Matematika
                          tutor:
                            id: 12
                            name: Tutor A
                          date: '2026-04-18'
                          start_time: '13:00'
                          end_time: '15:00'
                          status: confirmed
                      summary:
                        upcoming_count: 1
                        next_schedule:
                          id: 10
                          subject:
                            id: 2
                            name: Matematika
                          tutor:
                            id: 12
                            name: Tutor A
                          date: '2026-04-18'
                          start_time: '13:00'
                          end_time: '15:00'
                          status: confirmed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /dashboard/student/summary:
    get:
      tags: [Dashboard]
      summary: Student dashboard summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ringkasan dashboard student
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentDashboardSummaryData'
              examples:
                success:
                  value:
                    status: success
                    message: Ringkasan dashboard berhasil dimuat.
                    data:
                      session:
                        remaining_sessions: 7
                        used_sessions: 8
                        total_sessions: 15
                      summary:
                        upcoming_count: 1
                        next_schedule:
                          id: 10
                          subject:
                            id: 2
                            name: Matematika
                          tutor:
                            id: 12
                            name: Tutor A
                          date: '2026-04-18'
                          start_time: '13:00'
                          end_time: '15:00'
                          status: confirmed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /dashboard/student/recommended-tutors:
    get:
      tags: [Dashboard]
      summary: Student recommended tutors
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar tutor rekomendasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tutors]
                        properties:
                          tutors:
                            type: array
                            items:
                              $ref: '#/components/schemas/TutorPublic'
              examples:
                success:
                  value:
                    status: success
                    message: Tutor rekomendasi berhasil dimuat.
                    data:
                      tutors:
                        - id: 12
                          name: Tutor A
                          gender: female
                          profile_photo_path: null
                          rating: '4.90'
                          distance_km: 2.3
                        - id: 15
                          name: Tutor B
                          gender: male
                          profile_photo_path: null
                          rating: '4.70'
                          distance_km: 4.8
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /dashboard/tutor:
    get:
      tags: [Dashboard]
      summary: Tutor dashboard
      description: |
        `upcoming_schedules` = jadwal minggu ini & minggu depan.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard tutor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TutorDashboardData'
              examples:
                success:
                  value:
                    status: success
                    message: Dashboard tutor berhasil dimuat.
                    data:
                      upcoming_schedules:
                        - id: 22
                          date: '2026-04-18'
                          start_time: '09:00'
                          end_time: '11:00'
                          status: confirmed
                          student:
                            id: 9
                            name: John Doe
                            profile_photo_path: null
                      total_teaching_hours: 24
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /dashboard/tutor/summary:
    get:
      tags: [Dashboard]
      summary: Tutor dashboard summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ringkasan dashboard tutor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TutorDashboardSummaryData'
              examples:
                success:
                  value:
                    status: success
                    message: Ringkasan dashboard tutor berhasil dimuat.
                    data:
                      total_schedules: 30
                      total_completed: 18
                      total_cancelled: 2
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /tutor/schedule:
    get:
      tags: [Schedule]
      summary: Tutor schedules
      description: Hanya bisa diakses oleh user dengan role tutor.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jadwal tutor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleListData'
              examples:
                success:
                  value:
                    status: success
                    message: Jadwal tutor berhasil dimuat.
                    data:
                      schedules:
                        - id: 22
                          tutor_user_id: 12
                          student_user_id: 9
                          student_name: John Doe
                          date: '2026-04-18'
                          day: 6
                          time: '09:00:00'
                          status: active
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /student/schedule:
    get:
      tags: [Schedule]
      summary: Student schedules
      description: Hanya bisa diakses oleh user dengan role student.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jadwal student
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleListData'
              examples:
                success:
                  value:
                    status: success
                    message: Jadwal student berhasil dimuat.
                    data:
                      schedules:
                        - id: 10
                          tutor_user_id: 12
                          student_user_id: 9
                          tutor_name: Tutor A
                          date: '2026-04-18'
                          day: 6
                          time: '13:00:00'
                          status: active
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /student/schedule/history:
    get:
      tags: [Schedule]
      summary: Student learning history
      description: Riwayat belajar student berdasarkan jadwal yang sudah selesai, dibatalkan, ditolak, atau terlewat.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Riwayat belajar student
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentLearningHistoryData'
              examples:
                success:
                  value:
                    status: success
                    message: Data riwayat belajar berhasil terkirim
                    data:
                      history:
                        - id: 31
                          tutor_user_id: 12
                          student_user_id: 9
                          tutor_name: Tutor A
                          subject_name: Matematika
                          date: '2026-04-10'
                          day: 5
                          time: '13:00:00'
                          status: completed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /student/review:
    get:
      tags: [Review]
      summary: List student reviews
      description: Hanya bisa diakses oleh student.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar review student
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [reviews]
                        properties:
                          reviews:
                            type: array
                            items:
                              $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags: [Review]
      summary: Create review (1 session = 1 review)
      description: |
        Rules:
        - rate: number (1-5)
        - comment: string
        - 1 session = 1 review
        - hanya student yang boleh akses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpsertRequest'
      responses:
        '201':
          description: Review tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  value:
                    status: success
                    message: Review berhasil ditambahkan.
                    data: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [Review]
      summary: Update review (upsert)
      description: Patch review by session+tutor context (implementation-specific).
      security:
        - bearerAuth: []
