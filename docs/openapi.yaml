components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                status: error
                message: Unauthorized
                error: Unauthorized
    ForbiddenError:
      description: Forbidden (role-based access)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                status: error
                message: Forbidden
                error: Forbidden
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                status: error
                message: Not found
                error: Not found
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                status: error
                message: Validation error
                error:
                  email:
                    - The email field is required.

  schemas:
    SuccessResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          enum: [success]
          example: success
        message:
          type: string
          example: OK
        data:
          nullable: true
          oneOf:
            - type: object
            - type: array
              items: {}
          example: null

    ErrorResponse:
      type: object
      required: [status, message, error]
      properties:
        status:
          type: string
          enum: [error]
          example: error
        message:
          type: string
          example: Validation error
        error:
          description: Detail error (bisa string atau object, termasuk validation errors).
          oneOf:
            - type: string
              example: Unauthorized
            - $ref: '#/components/schemas/ValidationErrors'
            - type: object
          example:
            email:
              - The email field is required.

    ValidationErrors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

    Pagination:
      type: object
      required: [current_page, total, per_page, has_more]
      properties:
        current_page:
          type: integer
          example: 1
        total:
          type: integer
          example: 120
        per_page:
          type: integer
          example: 10
        total_pages:
          type: integer
          example: 12
        has_more:
          type: boolean
          example: true
        last_page:
          type: integer
          nullable: true
          example: 12
        next_page:
          type: integer
          nullable: true
          example: 2

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: student@example.com
        password:
          type: string
          format: password
          example: password123

    LoginResponseData:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          example: 1|y0ur_sanctum_t0ken
        user:
          $ref: '#/components/schemas/User'

    RegisterSendOtpRequest:
